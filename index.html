        // --- DATA MIGRATION & VALIDATION ---
        function normalizePoint(pt, m) {
            if (pt.chi_tiet_pha_bong) return pt;
            const isWin = pt.loai_diem === 'thang';
            const me = m.thong_tin.doi_thu_1 || 'Hungpv';
            const opp = m.thong_tin.doi_thu_2 || 'Doi_thu';

            let tinh_chat = isWin ? 'winner' : 'unforced_error';
            let nguoi_ket_thuc = isWin ? me : me; // default
            let ky_thuat_ket_thuc = pt.ky_thuat || null;

            if (pt.phuong_thuc === 'toi_ghi_diem') {
                tinh_chat = 'winner';
                nguoi_ket_thuc = me;
            } else if (pt.phuong_thuc === 'doi_thu_danh_hong') {
                tinh_chat = 'unforced_error';
                nguoi_ket_thuc = opp;
            } else if (pt.phuong_thuc === 'toi_danh_hong') {
                tinh_chat = 'unforced_error';
                nguoi_ket_thuc = me;
            } else if (pt.phuong_thuc === 'doi_thu_ghi_diem') {
                tinh_chat = 'winner';
                nguoi_ket_thuc = opp;
            }

            pt.chi_tiet_pha_bong = {
                tinh_chat: tinh_chat,
                nguoi_ket_thuc: nguoi_ket_thuc,
                ky_thuat_ket_thuc: ky_thuat_ket_thuc,
                nguoi_kien_tao: null,

                dac_tinh: {

                    do_dai: null,
                    do_xoay: null,
                    vi_tri_hong: null
                }
            };

            delete pt.nhom;
            delete pt.ky_thuat;
            delete pt.phuong_thuc;
            return pt;
        }

        function normalizeGame(g, m) {
            if (!g.danh_sach_diem) return g;
            g.danh_sach_diem.forEach(pt => normalizePoint(pt, m));
            return g;
        }

        function normalizeMatch(m) {
            if (!m.chi_tiet_game) return m;
            m.chi_tiet_game.forEach(g => normalizeGame(g, m));
            return m;
        }

        function migrateOldSchema() {
            if (!appState.matches) return;
            appState.matches.forEach(m => normalizeMatch(m));
        }

        
        function getOldProps(pt, m) {
            if (!pt.chi_tiet_pha_bong) return { phuong_thuc: pt.phuong_thuc, nhom: pt.nhom, ky_thuat: pt.ky_thuat };
            const c = pt.chi_tiet_pha_bong;
            const me = m.thong_tin.doi_thu_1 || 'Hungpv';
            const opp = m.thong_tin.doi_thu_2 || 'Doi_thu';
            
            let phuong_thuc = '';
            if (c.tinh_chat === 'winner') {
                phuong_thuc = (c.nguoi_ket_thuc === me) ? 'toi_ghi_diem' : 'doi_thu_ghi_diem';
            } else {
                phuong_thuc = (c.nguoi_ket_thuc === me) ? 'toi_danh_hong' : 'doi_thu_danh_hong';
            }
            
            let ky_thuat = c.ky_thuat_ket_thuc || '';
            let nhom = 'nhom_ky_thuat';
            if (appState.dict && appState.dict.loai_giao_bong && appState.dict.loai_giao_bong[ky_thuat]) {
                nhom = 'nhom_giao_bong';
            }
            return { phuong_thuc, nhom, ky_thuat };
        }

        function setOldProps(pt, loai_diem, ky_thuat, phuong_thuc, m) {
            const me = m.thong_tin.doi_thu_1 || 'Hungpv';
            const opp = m.thong_tin.doi_thu_2 || 'Doi_thu';
            
            let tinh_chat = loai_diem === 'thang' ? 'winner' : 'unforced_error';
            let nguoi_ket_thuc = me;
            
            if (phuong_thuc === 'toi_ghi_diem') {
                tinh_chat = 'winner';
                nguoi_ket_thuc = me;
            } else if (phuong_thuc === 'doi_thu_danh_hong') {
                tinh_chat = 'unforced_error';
                nguoi_ket_thuc = opp;
            } else if (phuong_thuc === 'toi_danh_hong') {
                tinh_chat = 'unforced_error';
                nguoi_ket_thuc = me;
            } else if (phuong_thuc === 'doi_thu_ghi_diem') {
                tinh_chat = 'winner';
                nguoi_ket_thuc = opp;
            }
            
            pt.loai_diem = loai_diem;
            pt.chi_tiet_pha_bong = {
                tinh_chat: tinh_chat,
                nguoi_ket_thuc: nguoi_ket_thuc,
                ky_thuat_ket_thuc: ky_thuat,
                nguoi_kien_tao: null,
                ky_thuat_kien_tao: null,
                dac_tinh: {
                    diem_roi_ngang: null,
                    do_dai: null,
                    do_xoay: null,
                    vi_tri_hong: null
                }
            };
            delete pt.nhom;
            delete pt.ky_thuat;
            delete pt.phuong_thuc;
            
            validatePoint(pt);
        }

        function validatePoint(pt) {
            const chi_tiet = pt.chi_tiet_pha_bong;
            if (!chi_tiet) return;
            
            if (chi_tiet.nguoi_ket_thuc === undefined) chi_tiet.nguoi_ket_thuc = null;
            if (chi_tiet.ky_thuat_ket_thuc === undefined) chi_tiet.ky_thuat_ket_thuc = null;
            if (chi_tiet.nguoi_kien_tao === undefined) chi_tiet.nguoi_kien_tao = null;
            if (chi_tiet.ky_thuat_kien_tao === undefined) chi_tiet.ky_thuat_kien_tao = null;
            
            if (!chi_tiet.dac_tinh) chi_tiet.dac_tinh = { diem_roi_ngang: null, do_dai: null, do_xoay: null, vi_tri_hong: null };
            if (chi_tiet.dac_tinh.diem_roi_ngang === undefined) chi_tiet.dac_tinh.diem_roi_ngang = null;
            if (chi_tiet.dac_tinh.do_dai === undefined) chi_tiet.dac_tinh.do_dai = null;
            if (chi_tiet.dac_tinh.do_xoay === undefined) chi_tiet.dac_tinh.do_xoay = null;
            if (chi_tiet.dac_tinh.vi_tri_hong === undefined) chi_tiet.dac_tinh.vi_tri_hong = null;

            // Validate unused properties are null
            if (chi_tiet.tinh_chat === 'winner') {
                chi_tiet.dac_tinh.vi_tri_hong = null;
            }
            if (chi_tiet.tinh_chat === 'forced_error' && !chi_tiet.nguoi_kien_tao) {
                // Must have nguoi_kien_tao
                chi_tiet.nguoi_kien_tao = "Unknown";
            }
            if (chi_tiet.tinh_chat === 'unforced_error') {
                chi_tiet.nguoi_kien_tao = null;
                chi_tiet.ky_thuat_kien_tao = null;
            }
        }


        // --- UTILS ---
        const b64EncodeUnicode = str => btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1)));
        const b64DecodeUnicode = str => decodeURIComponent(Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        const escapeHtml = unsafe => (unsafe||'').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        const showToast = (msg, type='info') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type==='error'?'bg-red-600':type==='success'?'bg-green-600':'bg-blue-600';
            toast.className = `${bg} text-white px-4 py-2 rounded shadow-lg text-sm transition-opacity duration-300`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        };
        const showModal = (contentHtml) => {
            const m = document.getElementById('modal-container');
            m.innerHTML = `<div class="bg-black bg-opacity-50 absolute inset-0" onclick="closeModal()"></div><div class="bg-white rounded-lg shadow-xl z-10 w-full max-w-md max-h-[90vh] overflow-y-auto relative p-4">${contentHtml}</div>`;
            m.classList.remove('hidden');
        };
        const closeModal = () => document.getElementById('modal-container').classList.add('hidden');

        // --- GITHUB API ---
        async function loadGithubConfig() {
            const stored = localStorage.getItem('bongban_gh_config');
            if (stored) {
                appState.github = { ...appState.github, ...JSON.parse(stored) };
                if (appState.github.token && appState.github.user && appState.github.repo) {
                    await fetchGithubData();
                    return;
                }
            }
            useMockData();
        }
        function saveGithubConfig(config) {
            appState.github = { ...appState.github, ...config };
            localStorage.setItem('bongban_gh_config', JSON.stringify(appState.github));
        }
        async function githubApi(method, path, body = null) {
            const { user, repo, branch, token } = appState.github;
            const url = new URL(`https://api.github.com/repos/${user}/${repo}/contents/${path}`);
            if (method === 'GET') {
                if (branch) url.searchParams.append('ref', branch);
            }
            // Add cache buster for all requests just to be safe
            url.searchParams.append('t', Date.now());

            const headers = { 
                'Accept': 'application/vnd.github.v3+json', 
                'Authorization': `Bearer ${token}`
            };
            const options = { method, headers, cache: 'no-store' };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(url.toString(), options);
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }
        async function fetchGithubData() {
            try {
                showToast('Đang tải dữ liệu từ GitHub...', 'info');
                const [dataRes, dictRes] = await Promise.all([
                    githubApi('GET', appState.github.dataPath).catch(e => null),
                    githubApi('GET', appState.github.dictPath).catch(e => null)
                ]);
                
                if (dictRes && dictRes.content) {
                    appState.dict = JSON.parse(b64DecodeUnicode(dictRes.content));
                    appState.github.dictSha = dictRes.sha;
                } else { appState.dict = MOCK_DICTIONARY; }

                if (dataRes && dataRes.content) {
                    appState.matches = JSON.parse(b64DecodeUnicode(dataRes.content));
                    migrateOldSchema();
                    appState.github.sha = dataRes.sha;
                    appState.isMock = false;
                    showToast('Tải dữ liệu thành công!', 'success');
                } else {
                    appState.matches = [];
                    appState.isMock = false;
                    appState.github.sha = null;
                }
            } catch (e) {
                console.error(e);
                showToast('Lỗi tải GitHub. Đang dùng dữ liệu mẫu.', 'error');
                useMockData();
            }
            updateStatusBar();
            renderView(appState.view);
        }
        async function saveToGithub() {
            if (appState.isMock) { showToast('Đã lưu cục bộ (Chế độ mẫu).', 'success'); renderView(appState.view); return; }
            if (appState.isSyncing) return;
            appState.isSyncing = true;
            try {
                showToast('Đang đồng bộ lên GitHub...', 'info');
                // Luôn ngầm thực hiện một lệnh GET để xin lại mã SHA mới nhất từ GitHub
                const currentRes = await githubApi('GET', appState.github.dataPath).catch(e => null);
                let latestSha = appState.github.sha;
                if (currentRes && currentRes.sha) {
                    latestSha = currentRes.sha;
                }
                
                const content = b64EncodeUnicode(JSON.stringify(appState.matches, null, 2));
                const body = { message: 'Update matches', content, branch: appState.github.branch };
                if (latestSha) {
                    body.sha = latestSha;
                }
                
                const res = await githubApi('PUT', appState.github.dataPath, body);
                appState.github.sha = res.content.sha;
                showToast('Đã đồng bộ GitHub thành công!', 'success');
            } catch (e) {
                console.error(e);
                showToast('Lỗi đồng bộ: ' + (e.message || 'Unknown'), 'error');
                alert('Lỗi đồng bộ: ' + e.message);
            } finally {
                appState.isSyncing = false;
            }
            renderView(appState.view);
        }
        function useMockData() {
            appState.isMock = true;
            appState.dict = MOCK_DICTIONARY;
            appState.matches = JSON.parse(JSON.stringify(MOCK_MATCHES));
            migrateOldSchema();
            updateStatusBar();
            renderView(appState.view);
        }
        function updateStatusBar() {
            const bar = document.getElementById('status-bar');
            if (appState.isMock) { bar.classList.remove('hidden'); bar.innerText = 'Chế độ dữ liệu mẫu'; bar.classList.remove('bg-green-500'); bar.classList.add('bg-yellow-500'); }
            else { bar.classList.remove('hidden'); bar.innerText = 'Đã kết nối GitHub'; bar.classList.remove('bg-yellow-500'); bar.classList.add('bg-green-500'); }
        }

        // --- GAME LOGIC (SCORING & SERVING) ---
        function parseScore(str) { const p = (str||'0-0').split('-'); return { p1: parseInt(p[0])||0, p2: parseInt(p[1])||0 }; }
        function stringifyScore(p1, p2) { return `${p1}-${p2}`; }
        function calculateCurrentState(startScoreStr, ptsArray) {
            let {p1, p2} = parseScore(startScoreStr);
            for(let pt of ptsArray) { if(pt.loai_diem === 'thang') p1++; else p2++; }
            return {p1, p2, total: p1+p2};
        }
        function determineServer(startScore, pointsArray, firstServerAtStart, doiThu1, doiThu2) {
            let { p1, p2 } = parseScore(startScore);
            let tempP1 = p1, tempP2 = p2;
            let currentServer = firstServerAtStart;
            
            for (let i = 0; i < pointsArray.length; i++) {
                if (tempP1 >= 10 && tempP2 >= 10) {
                    currentServer = currentServer === doiThu1 ? doiThu2 : doiThu1;
                } else {
                    if ((p1 + p2 + i) % 2 === 1) {
                        currentServer = currentServer === doiThu1 ? doiThu2 : doiThu1;
                    }
                }
                let pt = pointsArray[i];
                if (pt.loai_diem === 'thang') tempP1++; else tempP2++;
            }
            return currentServer;
        }
        window.undoLastPoint = async function() {
            const match = appState.matches.find(m => m.id_tran_dau === appState.currentMatchId);
            const game = match.chi_tiet_game[appState.currentGameIndex];
            if(game.danh_sach_diem.length > 0) {
                game.danh_sach_diem.pop();
                recalculateGameTimeline(game, match.thong_tin.doi_thu_1, match.thong_tin.doi_thu_2);
                await saveToGithub();
                renderView(appState.view);
            }
        };

        window.deletePoint = async function(idx) {
            if(!confirm('Bạn có chắc chắn muốn xóa điểm này?')) return;
            const match = appState.matches.find(m => m.id_tran_dau === appState.currentMatchId);
            const game = match.chi_tiet_game[appState.currentGameIndex];
            if(idx >= 0 && idx < game.danh_sach_diem.length) {
                game.danh_sach_diem.splice(idx, 1);
                recalculateGameTimeline(game, match.thong_tin.doi_thu_1, match.thong_tin.doi_thu_2);
                await saveToGithub();
                renderView(appState.view);
            }
        };

        function recalculateGameTimeline(game, dt1, dt2) {
            let {p1, p2} = parseScore(game.ty_so_bat_dau);
            let tempPts = [];
            for(let i=0; i<game.danh_sach_diem.length; i++) {
                let pt = game.danh_sach_diem[i];
                let server = determineServer(game.ty_so_bat_dau, tempPts, game.nguoi_giao_bong_truoc, dt1, dt2);
                if(pt.loai_diem==='thang') p1++; else p2++;
                pt.thu_tu_diem = i+1;
                pt.nguoi_giao_bong = server;
                pt.ty_so_hien_tai = stringifyScore(p1, p2);
                tempPts.push(pt);
            }
            game.ty_so_chung_cuoc = stringifyScore(p1, p2);
        }
        function isGameFinished(p1, p2) { return ((p1>=11 && p1-p2>=2) || (p2>=11 && p2-p1>=2)); }

        // --- TIMELINE & POINT INPUT ---
        let inputTab = 'thang'; // thang, thua
        function renderGameTimeline(container) {
            const match = appState.matches.find(m => m.id_tran_dau === appState.currentMatchId);
            const game = match.chi_tiet_game[appState.currentGameIndex];

        window.selectTinhChat = function(val) {
            window.ptEntryState.tinh_chat = val;

            const me = match.thong_tin.doi_thu_1 || 'Tôi';
            const opp = match.thong_tin.doi_thu_2 || 'Đối thủ';

            if (val === 'winner') {
                window.ptEntryState.nguoi_ket_thuc = (window.ptEntryState.loai_diem === 'thang') ? me : opp;
            } else if (val === 'unforced_error') {
                window.ptEntryState.nguoi_ket_thuc = (window.ptEntryState.loai_diem === 'thua') ? me : opp;
            } else if (val === 'forced_error') {
                window.ptEntryState.nguoi_ket_thuc = (window.ptEntryState.loai_diem === 'thua') ? me : opp;

                        <button onclick="updatePtState('${key}', '${opp}')" class="flex-1 p-3 rounded-xl font-bold border transition ${s[key]===opp?'bg-blue-600 text-white border-blue-600 shadow-md':'bg-white text-gray-700 border-gray-300 shadow-sm'}">${opp}</button>

                    ${!hideServe ? `
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        ${serveKeys.map(k => `<button onclick="updatePtState('${key}', '${k}')" class="p-3 rounded-xl font-semibold text-xs border transition ${s[key]===k?'bg-blue-600 text-white border-blue-600 shadow-md':'bg-white text-gray-700 border-gray-300 shadow-sm'}">${appState.dict.loai_giao_bong[k]}</button>`).join('')}
                    </div>` : ''}
                    <div class="grid grid-cols-3 gap-2">
                        ${techKeys.map(k => `<button onclick="updatePtState('${key}', '${k}')" class="p-2 rounded-xl font-semibold text-xs border transition ${s[key]===k?'bg-blue-600 text-white border-blue-600 shadow-md':'bg-white text-gray-700 border-gray-300 shadow-sm'}">${appState.dict.ky_thuat_rally[k]}</button>`).join('')}

                // Nếu dict có các key khác, vẫn render được.

                    <div class="grid grid-cols-${cols.length} gap-2">

                            const tenNgan = appState.dict.thuoc_tinh_bong.do_dai.ngan || 'Ngắn';
                            const tenNgang = appState.dict.thuoc_tinh_bong.diem_roi_ngang[col] || col;
                            const btnDai = `<button onclick="updateDiemRoi('${col}', 'dai')" class="p-2 rounded-xl font-bold text-xs border transition ${(s.dac_tinh.diem_roi_ngang===col && s.dac_tinh.do_dai==='dai')?'bg-blue-600 text-white border-blue-600 shadow-md':'bg-white text-gray-700 border-gray-300 shadow-sm'}">${tenDai}<br>${tenNgang}</button>`;
                            const btnNgan = `<button onclick="updateDiemRoi('${col}', 'ngan')" class="p-2 rounded-xl font-bold text-xs border transition ${(s.dac_tinh.diem_roi_ngang===col && s.dac_tinh.do_dai==='ngan')?'bg-blue-600 text-white border-blue-600 shadow-md':'bg-white text-gray-700 border-gray-300 shadow-sm'}">${tenNgan}<br>${tenNgang}</button>`;
                            return `<div class="flex flex-col gap-2">
                                ${isWin ? btnDai : btnNgan}

                            <button onclick="updatePtStateDacTinh('do_xoay', '${x}')" class="flex-1 py-3 rounded-lg font-bold text-sm transition ${s.dac_tinh.do_xoay===x?'bg-white text-blue-700 shadow-sm':'text-gray-500 hover:text-gray-700'}">${appState.dict.thuoc_tinh_bong.do_xoay[x]}</button>
                        `).join('')}
                    </div>
                </div>
            `;

            const renderViTriHong = () => `
                <div class="mb-5">
                    <label class="block text-sm font-black text-gray-800 mb-2">Vị trí hỏng</label>
                    <div class="grid grid-cols-2 gap-2">
                        ${hongKeys.map(k => `
                            <button onclick="updatePtStateDacTinh('vi_tri_hong', '${k}')" class="p-4 rounded-xl font-bold text-sm border transition ${s.dac_tinh.vi_tri_hong===k?'bg-red-600 text-white border-red-600 shadow-md':'bg-white text-gray-700 border-gray-300 shadow-sm'}">${appState.dict.thuoc_tinh_loi.vi_tri_hong[k]}</button>
                        `).join('')}
                    </div>
                </div>
            `;

            let html = `<div id="pt-entry-scroll" class="max-h-[70vh] overflow-y-auto no-scrollbar pb-6 px-1">
                <div class="flex items-center justify-between mb-4 pb-2 border-b sticky top-0 bg-white z-10 pt-2">
                    <h3 class="font-black text-lg text-gray-800">${appState.dict.tinh_chat_pha_bong[s.tinh_chat] || s.tinh_chat}</h3>
                    <button onclick="openPointModal('${s.loai_diem}')" class="text-sm text-gray-500 hover:text-gray-800 font-bold bg-gray-100 px-3 py-1.5 rounded-full"><i class="fas fa-undo mr-1"></i>Đổi</button>

            if (s.tinh_chat === 'winner') {
                html += renderPlayerSelect("Người ghi điểm (Kết thúc)", "nguoi_ket_thuc");

        window.updatePtState = function(key, val) {
            window.ptEntryState[key] = val;
            renderPtEntryForm();
        };
        window.updatePtStateDacTinh = function(key, val) {

        window.savePtEntry = async function() {
            const s = window.ptEntryState;
            if (!s.nguoi_ket_thuc) { showToast('Vui lòng chọn người kết thúc/đánh hỏng', 'error'); return; }
            if (!s.ky_thuat_ket_thuc) { showToast('Vui lòng chọn kỹ thuật', 'error'); return; }
            if (s.tinh_chat === 'forced_error') {
                if (!s.nguoi_kien_tao) { showToast('Vui lòng chọn người kiến tạo', 'error'); return; }
                if (!s.ky_thuat_kien_tao) { showToast('Vui lòng chọn kỹ thuật kiến tạo', 'error'); return; }
                if (!s.dac_tinh.vi_tri_hong) { showToast('Vui lòng chọn vị trí hỏng', 'error'); return; }
            }
            if (s.tinh_chat === 'unforced_error') {
                if (!s.dac_tinh.vi_tri_hong) { showToast('Vui lòng chọn vị trí hỏng', 'error'); return; }
            }
            
            const match = appState.matches.find(m => m.id_tran_dau === appState.currentMatchId);
            const game = match.chi_tiet_game[appState.currentGameIndex];
            
            if (s.isEdit) {
                const pt = game.danh_sach_diem[s.editIdx];
                pt.loai_diem = s.loai_diem;
                pt.chi_tiet_pha_bong = {
                    tinh_chat: s.tinh_chat,
                    nguoi_ket_thuc: s.nguoi_ket_thuc,
                    ky_thuat_ket_thuc: s.ky_thuat_ket_thuc,
                    nguoi_kien_tao: s.nguoi_kien_tao,
                    ky_thuat_kien_tao: s.ky_thuat_kien_tao,
                    dac_tinh: {
                        diem_roi_ngang: s.dac_tinh.diem_roi_ngang || null,
                        do_dai: s.dac_tinh.do_dai || null,
                        do_xoay: s.dac_tinh.do_xoay || null,
                        vi_tri_hong: s.dac_tinh.vi_tri_hong || null
                    }
                };
                validatePoint(pt);
            } else {
                const state = calculateCurrentState(game.ty_so_bat_dau, game.danh_sach_diem);
                if(isGameFinished(state.p1, state.p2) && !confirm('Game đã đủ điều kiện kết thúc. Bạn có chắc chắn muốn nhập thêm điểm?')) return;

function calculateDashboardStats(filteredMatches, perspective = 'doi_thu_1') {
    const s = {
        matches: { total: 0, win: 0 },
        games: { total: 0, win: 0 },
        points: { total: 0, win: 0, lose: 0 },
        
        winnerByMe: 0, forcedErrorByMe: 0, unforcedErrorByMe: 0, forcedErrorAgainstMe: 0,
        opponentStats: { winner: 0, forced: 0, unforced: 0 },
        
        technique: {}, 
        
        serve: { total: 0, win: 0 },
        receive: { total: 0, win: 0 },
        serveByType: {},
        serveByGame: {},
        
        maxWinStreak: 0, maxForcedStreak: 0, maxUnforcedStreak: 0,
        
        gameSummary: [], 
        
        spin: {},
        heatmapWinner: { ngan_trai: 0, ngan_giua: 0, ngan_phai: 0, dai_trai: 0, dai_giua: 0, dai_phai: 0 },
        heatmapLost: { ngan_trai: 0, ngan_giua: 0, ngan_phai: 0, dai_trai: 0, dai_giua: 0, dai_phai: 0 },
    };

    filteredMatches.forEach(m => {
        s.matches.total++;
        let mWins = 0, mLoses = 0;
        const me = perspective === 'doi_thu_1' ? m.thong_tin.doi_thu_1 : m.thong_tin.doi_thu_2;
        const opp = perspective === 'doi_thu_1' ? m.thong_tin.doi_thu_2 : m.thong_tin.doi_thu_1;

        if (m.chi_tiet_game) m.chi_tiet_game.forEach((g, gIndex) => {
            s.games.total++;
            let gWins = 0, gLoses = 0;
            let currentWinStreak = 0;
            let currentForcedStreak = 0;
            let currentUnforcedStreak = 0;
            
            let gWinnerMe = 0, gForcedMe = 0, gUnforcedMe = 0;
            
            // For Serve By Game
            const gameKey = `Game ${g.game_so}`;
            if (!s.serveByGame[gameKey]) s.serveByGame[gameKey] = { total: 0, win: 0 };

            if (g.danh_sach_diem) g.danh_sach_diem.forEach(pt => {
                const c = pt.chi_tiet_pha_bong;
                if (!c) return;
                
                s.points.total++;
                const isWin = perspective === 'doi_thu_1' ? pt.loai_diem === 'thang' : pt.loai_diem === 'thua';
                if (isWin) { s.points.win++; gWins++; } else { s.points.lose++; gLoses++; }

                // Serve
                if (pt.nguoi_giao_bong === me) {
                    s.serve.total++;
                    s.serveByGame[gameKey].total++;
                    if (isWin) {
                        s.serve.win++;
                        s.serveByGame[gameKey].win++;
                    }
                    
                    // Serve by type if it's the ending technique
                    if (c.ky_thuat_ket_thuc && appState.dict.loai_giao_bong && appState.dict.loai_giao_bong[c.ky_thuat_ket_thuc]) {
                        const t = c.ky_thuat_ket_thuc;
                        if (!s.serveByType[t]) s.serveByType[t] = { total: 0, win: 0 };
                        s.serveByType[t].total++;
                        if (isWin) s.serveByType[t].win++;
                    }
                } else {
                    s.receive.total++;
                    if (isWin) s.receive.win++;
                }

                // Streaks
                if (isWin) {
                    currentWinStreak++;
                    if (currentWinStreak > s.maxWinStreak) s.maxWinStreak = currentWinStreak;
                } else currentWinStreak = 0;

                if (isWin && c.tinh_chat === 'forced_error') {
                    currentForcedStreak++;
                    if (currentForcedStreak > s.maxForcedStreak) s.maxForcedStreak = currentForcedStreak;
                } else currentForcedStreak = 0;

                if (!isWin && c.tinh_chat === 'unforced_error') {
                    currentUnforcedStreak++;
                    if (currentUnforcedStreak > s.maxUnforcedStreak) s.maxUnforcedStreak = currentUnforcedStreak;
                } else currentUnforcedStreak = 0;

                // Tinh chat
                if (c.nguoi_ket_thuc === me) {
                    if (c.tinh_chat === 'winner') { s.winnerByMe++; gWinnerMe++; }
                    if (c.tinh_chat === 'unforced_error') { s.unforcedErrorByMe++; gUnforcedMe++; }
                    if (c.tinh_chat === 'forced_error') { s.forcedErrorAgainstMe++; }
                } else if (c.nguoi_ket_thuc === opp) {
                    if (c.tinh_chat === 'winner') { s.opponentStats.winner++; }
                    if (c.tinh_chat === 'unforced_error') { s.opponentStats.unforced++; }
                    if (c.tinh_chat === 'forced_error') { s.opponentStats.forced++; }
                }
                
                if (c.nguoi_kien_tao === me && c.tinh_chat === 'forced_error') {
                    s.forcedErrorByMe++;
                    gForcedMe++;
                }

                // Tech
                const techFinish = c.ky_thuat_ket_thuc;
                const techAssist = c.ky_thuat_kien_tao;
                
                const initTech = (t) => {
                    if (!s.technique[t]) s.technique[t] = { scoring: 0, losing: 0, winner: 0, forcedByMe: 0, unforced: 0, forcedAgainstMe: 0 };
                };
                
                if (techFinish && appState.dict.ky_thuat_rally[techFinish]) {
                    if (c.nguoi_ket_thuc === me) {
                        initTech(techFinish);
                        if (c.tinh_chat === 'winner') { s.technique[techFinish].winner++; s.technique[techFinish].scoring++; }
                        if (c.tinh_chat === 'unforced_error') { s.technique[techFinish].unforced++; s.technique[techFinish].losing++; }
                        if (c.tinh_chat === 'forced_error') { s.technique[techFinish].forcedAgainstMe++; s.technique[techFinish].losing++; }
                    }
                }
                
                if (techAssist && appState.dict.ky_thuat_rally[techAssist]) {
                    if (c.nguoi_kien_tao === me && c.tinh_chat === 'forced_error') {
                        initTech(techAssist);
                        s.technique[techAssist].forcedByMe++;
                        s.technique[techAssist].scoring++;
                    }
                }

                // Heatmap & Spin
                const dac_tinh = c.dac_tinh;
                if (dac_tinh) {
                    if (dac_tinh.diem_roi_ngang && dac_tinh.do_dai) {
                        const key = `${dac_tinh.do_dai}_${dac_tinh.diem_roi_ngang}`;
                        if (isWin) s.heatmapWinner[key] = (s.heatmapWinner[key] || 0) + 1;
                        else s.heatmapLost[key] = (s.heatmapLost[key] || 0) + 1;
                    }
                    if (dac_tinh.do_xoay) {
                        if (!s.spin[dac_tinh.do_xoay]) s.spin[dac_tinh.do_xoay] = { total: 0, win: 0, forcedErrorByMe: 0, forcedErrorAgainstMe: 0 };
                        s.spin[dac_tinh.do_xoay].total++;
                        if (isWin) s.spin[dac_tinh.do_xoay].win++;
                        
                        if (c.tinh_chat === 'forced_error') {
                            if (c.nguoi_kien_tao === me) s.spin[dac_tinh.do_xoay].forcedErrorByMe++;
                            if (c.nguoi_ket_thuc === me) s.spin[dac_tinh.do_xoay].forcedErrorAgainstMe++;
                        }
                    }
                }
            });
            if (gWins > gLoses) mWins++; else if (gLoses > gWins) mLoses++;
            
            s.gameSummary.push({
                match: `${m.thong_tin.doi_thu_1} vs ${m.thong_tin.doi_thu_2}`,
                game_so: g.game_so,
                pts: g.danh_sach_diem ? g.danh_sach_diem.length : 0,
                winnerMe: gWinnerMe,
                forcedMe: gForcedMe,
                unforcedMe: gUnforcedMe,
                isWin: gWins > gLoses
            });
        });
    });

    return s;
}

        <div class="bg-white rounded-xl shadow-sm border p-3">
            <h3 class="text-xs font-bold text-gray-800 text-center mb-2 uppercase text-green-700">ĐIỂM RƠI GHI ĐIỂM (THẮNG)</h3>
            <div class="grid grid-cols-3 gap-0.5 relative bg-gray-200 p-0.5 border-2 border-green-300">
                <div class="absolute inset-0 border-b-2 border-dashed border-green-400 pointer-events-none z-20" style="top: 50%"></div>
                ${getHeatmapCell(s.heatmapWinner['dai_phai'] || 0, s.points.win, 'Dài Phải', 'win')}
                ${getHeatmapCell(s.heatmapWinner['dai_giua'] || 0, s.points.win, 'Dài Giữa', 'win')}
                ${getHeatmapCell(s.heatmapWinner['dai_trai'] || 0, s.points.win, 'Dài Trái', 'win')}
                ${getHeatmapCell(s.heatmapWinner['ngan_phai'] || 0, s.points.win, 'Ngắn Phải', 'win')}
                ${getHeatmapCell(s.heatmapWinner['ngan_giua'] || 0, s.points.win, 'Ngắn Giữa', 'win')}
                ${getHeatmapCell(s.heatmapWinner['ngan_trai'] || 0, s.points.win, 'Ngắn Trái', 'win')}
            </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border p-3">
            <h3 class="text-xs font-bold text-gray-800 text-center mb-2 uppercase text-red-700">ĐIỂM RƠI MẤT ĐIỂM (THUA)</h3>
            <div class="grid grid-cols-3 gap-0.5 relative bg-gray-200 p-0.5 border-2 border-red-300">
                <div class="absolute inset-0 border-b-2 border-dashed border-red-400 pointer-events-none z-20" style="top: 50%"></div>
                ${getHeatmapCell(s.heatmapLost['ngan_trai'] || 0, s.points.lose, 'Ngắn Trái', 'lose')}
                ${getHeatmapCell(s.heatmapLost['ngan_giua'] || 0, s.points.lose, 'Ngắn Giữa', 'lose')}
                ${getHeatmapCell(s.heatmapLost['ngan_phai'] || 0, s.points.lose, 'Ngắn Phải', 'lose')}
                ${getHeatmapCell(s.heatmapLost['dai_trai'] || 0, s.points.lose, 'Dài Trái', 'lose')}
                ${getHeatmapCell(s.heatmapLost['dai_giua'] || 0, s.points.lose, 'Dài Giữa', 'lose')}
                ${getHeatmapCell(s.heatmapLost['dai_phai'] || 0, s.points.lose, 'Dài Phải', 'lose')}
            </div>
        </div>
    </div>`;

    html += `<div class="bg-white rounded-xl shadow-sm border p-4 mb-4"><h3 class="font-bold text-gray-800 border-b pb-2 mb-3">PHÂN TÍCH ĐỘ XOÁY</h3>`;
    const spinKeys = Object.keys(s.spin);
    if(spinKeys.length > 0) {
        spinKeys.forEach(k => {
            const sp = s.spin[k];
            const name = appState.dict.thuoc_tinh_bong.do_xoay[k] || k;
            html += `
                <div class="py-2 border-b last:border-0">
                    <div class="flex justify-between items-center mb-1"><span class="font-bold text-sm text-gray-800">${name}</span><span class="text-xs text-gray-500">${sp.total} điểm</span></div>
                    <div class="flex gap-2">
                        <div class="flex-1">
                            <div class="flex justify-between text-[10px] font-bold text-gray-500"><span>Win Rate</span><span>${toPct(sp.win, sp.total)}%</span></div>
                            ${bar(toPct(sp.win, sp.total))}
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between text-[10px] font-bold text-gray-500"><span>Tỷ lệ bị ép đánh hỏng</span><span>${toPct(sp.forcedErrorAgainstMe, s.points.lose)}%</span></div>
                            ${bar(toPct(sp.forcedErrorAgainstMe, s.points.lose), 'bg-red-500')}
                        </div>
                    </div>
                </div>
            `;
        });
    } else {
        html += `<div class="text-sm text-gray-500">Chưa có dữ liệu phân tích độ xoáy.</div>`;
    }
    html += `</div></div>`;

    // --- NHÓM 3: TOP 10 KỸ THUẬT ---
    html += `<div><h2 class="text-xl font-black text-gray-800 border-b-2 border-gray-800 pb-2 mb-4 uppercase mt-8">3. BẢNG XẾP HẠNG KỸ THUẬT (TOP 10)</h2>`;
    
    // Top 10 Scoring
    const topScoring = Object.keys(s.technique).sort((a,b)=>s.technique[b].scoring - s.technique[a].scoring).filter(k => s.technique[k].scoring > 0).slice(0, 10);
    html += `<div class="bg-white rounded-xl shadow-sm border p-4 mb-4"><h3 class="font-bold text-green-700 border-b pb-2 mb-3">Top 10 Kỹ thuật ghi điểm (Winner + Ép đối thủ lỗi)</h3>`;
    if(topScoring.length>0) {
        topScoring.forEach(k => {
            const tech = s.technique[k];
            html += `
                <div class="py-2 border-b last:border-0 text-sm flex justify-between items-center">
                    <span class="font-semibold">${getName(k)}</span>
                    <div class="text-right">
                        <span class="font-black text-green-600 text-lg">${tech.scoring}</span>
                        <div class="text-[10px] text-gray-500">${tech.winner} winner &bull; ${tech.forcedByMe} ép lỗi</div>
                    </div>
                </div>
            `;
        });
    } else {
        html += `<div class="text-sm text-gray-500">Chưa có dữ liệu ghi điểm.</div>`;
    }
    html += `</div>`;
    
    // Top 10 Losing
    const topLosing = Object.keys(s.technique).sort((a,b)=>s.technique[b].losing - s.technique[a].losing).filter(k => s.technique[k].losing > 0).slice(0, 10);
    html += `<div class="bg-white rounded-xl shadow-sm border p-4 mb-4"><h3 class="font-bold text-red-700 border-b pb-2 mb-3">Top 10 Kỹ thuật mất điểm (Tự hỏng + Bị ép lỗi)</h3>`;
    if(topLosing.length>0) {
        topLosing.forEach(k => {
            const tech = s.technique[k];
            html += `
                <div class="py-2 border-b last:border-0 text-sm flex justify-between items-center">
                    <span class="font-semibold">${getName(k)}</span>
                    <div class="text-right">
                        <span class="font-black text-red-600 text-lg">${tech.losing}</span>
                        <div class="text-[10px] text-gray-500">${tech.unforced} tự hỏng &bull; ${tech.forcedAgainstMe} bị ép lỗi</div>
                    </div>
                </div>
            `;
        });
    } else {
        html += `<div class="text-sm text-gray-500">Chưa có dữ liệu mất điểm.</div>`;
    }
    html += `</div></div>`;


    // --- NHÓM 4: Momentum & Game Summary ---
    html += `
        <div>
            <h2 class="text-xl font-black text-gray-800 border-b-2 border-gray-800 pb-2 mb-4 uppercase mt-8">4. Momentum & Tóm tắt Game</h2>
            <div class="bg-white rounded-xl shadow-sm border p-4 mb-4">
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div><div class="text-[10px] uppercase text-gray-500 font-bold">Chuỗi Thắng</div><div class="font-black text-green-600 text-2xl">${s.maxWinStreak}</div></div>
                    <div><div class="text-[10px] uppercase text-gray-500 font-bold">Chuỗi Ép lỗi</div><div class="font-black text-blue-600 text-2xl">${s.maxForcedStreak}</div></div>
                    <div><div class="text-[10px] uppercase text-gray-500 font-bold">Chuỗi Tự hỏng</div><div class="font-black text-red-600 text-2xl">${s.maxUnforcedStreak}</div></div>
                </div>
            </div>
    `;

    if (s.gameSummary.length > 0) {
        html += `
                <div class="bg-white rounded-xl shadow-sm border p-4 overflow-x-auto">
                    <table class="w-full text-xs text-left whitespace-nowrap">
                        <thead class="text-gray-500 bg-gray-50 uppercase border-b">
                            <tr>
                                <th class="px-2 py-2">Game</th>
                                <th class="px-2 py-2 text-center">Pha bóng</th>
                                <th class="px-2 py-2 text-center text-green-600">Winner</th>
                                <th class="px-2 py-2 text-center text-blue-600">Ép hỏng</th>
                                <th class="px-2 py-2 text-center text-red-600">Tự hỏng</th>
                                <th class="px-2 py-2 text-center">Kết quả</th>
                            </tr>
                        </thead>
                        <tbody>
        `;
        s.gameSummary.forEach(g => {
            html += `
                <tr class="border-b last:border-0">
                    <td class="px-2 py-2 font-bold">${g.game_so}</td>
                    <td class="px-2 py-2 text-center">${g.pts}</td>
                    <td class="px-2 py-2 text-center text-green-600 font-semibold">${g.winnerMe}</td>
                    <td class="px-2 py-2 text-center text-blue-600 font-semibold">${g.forcedMe}</td>
                    <td class="px-2 py-2 text-center text-red-600 font-semibold">${g.unforcedMe}</td>
                    <td class="px-2 py-2 text-center">
                        ${g.isWin ? `<span class="bg-green-100 text-green-800 text-[10px] uppercase px-2 py-1 rounded font-bold">Thắng</span>` : `<span class="bg-gray-100 text-gray-800 text-[10px] uppercase px-2 py-1 rounded font-bold">Thua</span>`}
                    </td>
                </tr>
            `;
        });
        html += `</tbody></table></div>`;
    }
    html += `</div></div>`;

    container.innerHTML = html;
};

window.updateDashboardPerspective = function(pers) {
            appState.dashboardPerspective = pers;
            renderView('dashboard');
        };
        
        window.updateDashboardFilter = function() {
            appState.dashboardFilter = {
                matchId: document.getElementById('dbFilterMatch').value,
                fromDate: document.getElementById('dbFilterFrom').value,
                toDate: document.getElementById('dbFilterTo').value,
                loai_hinh: document.getElementById('dbFilterType').value,
                doi_thu: document.getElementById('dbFilterOpp').value,
                _lastMatchId: document.getElementById('dbFilterMatch').value
            };
            appState.currentMatchId = appState.dashboardFilter.matchId === 'all' ? null : appState.dashboardFilter.matchId;
            renderView('dashboard');
        };

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            loadGithubConfig();
        });
    </script>
</body>
</html>
